<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="Noah">
  <meta name="keywords" content="小苹果发布页,小苹果最新地址,小苹果网址多少">
  <meta name="description" content="小苹果网址发布页，提供最新地址、备用地址和客户端下载入口。">
  <meta name="theme-color" content="#079778">
  <meta name="color-scheme" content="light">

  <title>小苹果地址发布页</title>
  <link rel="icon" href="favicon.ico">

  <style>
    :root {
      --page-green: #079778;
      --page-green-light: #5fba91;
      --primary: #078c70;
      --primary-hover: #05765e;
      --text: #19231f;
      --muted: #68736e;
      --surface: rgba(255, 255, 255, 0.96);
      --border: rgba(7, 140, 112, 0.14);
      --danger: #d83a3a;
      --shadow: 0 24px 60px rgba(0, 63, 49, 0.22);
      --radius-lg: 24px;
      --radius-md: 15px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--page-green);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 12%, rgba(255,255,255,.18), transparent 26%),
        radial-gradient(circle at 90% 86%, rgba(255,255,255,.14), transparent 24%),
        linear-gradient(145deg, var(--page-green), var(--page-green-light));
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid rgba(255, 183, 0, 0.72);
      outline-offset: 3px;
    }

    .page-shell {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      padding: max(32px, env(safe-area-inset-top)) 18px
        max(28px, env(safe-area-inset-bottom));
    }

    .page-content {
      position: relative;
      z-index: 2;
      width: min(100%, 620px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 0 0 24px;
      color: #fff;
      text-align: center;
      text-shadow: 0 4px 20px rgba(0, 55, 43, 0.22);
    }

    .brand__logo {
      width: 64px;
      height: 64px;
      flex: 0 0 auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0, 55, 43, 0.2));
    }

    .brand__title {
      margin: 0;
      font-size: clamp(28px, 7vw, 42px);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.15;
    }

    .panel {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.56);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .panel__header {
      padding: 22px 24px;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, #068f71, #12a981);
    }

    .panel__header h2 {
      margin: 0;
      font-size: clamp(18px, 4vw, 23px);
      font-weight: 750;
      line-height: 1.45;
    }

    .panel__body {
      padding: 22px;
    }

    .help-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .help-link {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      border: 1px solid rgba(135, 59, 170, 0.16);
      border-radius: 999px;
      color: #7d2d91;
      font-size: 14px;
      font-weight: 700;
      background: #fbf3ff;
      transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
    }

    .help-link:hover {
      transform: translateY(-1px);
      background: #f5e7fb;
      box-shadow: 0 8px 20px rgba(91, 39, 112, 0.1);
    }

    .address-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .address-link {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #fff;
      box-shadow: 0 7px 20px rgba(16, 61, 49, 0.06);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .address-link:hover {
      transform: translateY(-2px);
      border-color: rgba(7, 140, 112, 0.42);
      box-shadow: 0 13px 28px rgba(16, 61, 49, 0.12);
    }

    .address-link__content {
      min-width: 0;
    }

    .address-link__title {
      display: block;
      font-size: clamp(17px, 4.5vw, 20px);
      font-weight: 800;
      line-height: 1.35;
    }

    .address-link__description {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .address-link__action {
      flex: 0 0 auto;
      color: var(--danger);
      font-size: 14px;
      font-weight: 750;
      white-space: nowrap;
    }

    .address-link__action::after {
      content: " →";
    }

    .address-link--app {
      border-color: rgba(216, 58, 58, 0.17);
      background: #fffafa;
    }

    .notice {
      display: grid;
      gap: 12px;
      margin-top: 20px;
      padding: 16px;
      border-radius: var(--radius-md);
      color: #43504a;
      font-size: 14px;
      line-height: 1.75;
      background: #f2f8f5;
    }

    .notice p {
      margin: 0;
    }

    .notice strong {
      color: #25322c;
    }

    .notice a {
      color: var(--primary);
      font-weight: 750;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .footer {
      margin: 22px 0 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 13px;
      font-weight: 550;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0, 55, 43, 0.2);
    }

    .bubbles {
      position: absolute;
      z-index: 1;
      inset: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      pointer-events: none;
      list-style: none;
    }

    .bubbles li {
      position: absolute;
      bottom: -180px;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.12);
      animation: float-up 24s linear infinite;
    }

    .bubbles li:nth-child(1) { left: 7%; }
    .bubbles li:nth-child(2) { left: 18%; width: 82px; height: 82px; animation-delay: 2s; animation-duration: 18s; }
    .bubbles li:nth-child(3) { left: 29%; animation-delay: 5s; }
    .bubbles li:nth-child(4) { left: 42%; width: 66px; height: 66px; animation-duration: 21s; }
    .bubbles li:nth-child(5) { left: 62%; animation-delay: 1s; }
    .bubbles li:nth-child(6) { left: 77%; width: 122px; height: 122px; animation-delay: 4s; }
    .bubbles li:nth-child(7) { left: 90%; width: 156px; height: 156px; animation-delay: 7s; }
    .bubbles li:nth-child(8) { left: 53%; width: 24px; height: 24px; animation-delay: 12s; animation-duration: 34s; }

    @keyframes float-up {
      from { transform: translate3d(0, 0, 0) rotate(0deg); }
      to { transform: translate3d(0, -120vh, 0) rotate(420deg); }
    }

    @media (max-width: 540px) {
      .page-shell {
        place-items: start center;
        padding-inline: 14px;
      }

      .brand {
        flex-direction: column;
        gap: 8px;
        margin-bottom: 18px;
      }

      .brand__logo {
        width: 58px;
        height: 58px;
      }

      .panel__header,
      .panel__body {
        padding-inline: 16px;
      }

      .address-link {
        min-height: 72px;
        padding: 15px;
      }

      .address-link__action {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      .bubbles { display: none; }
    }
  </style>
</head>
